<!-- RPG画面の土台 -->
 <!-- 後からmain.jsとscreen.jsで書き換える -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>yuiRPG</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- game全体の見た目を統一 -->
    <main class="game">
      <h1 class="site-logo">yuiRPG</h1>

      <!-- game-infoで連勝数やフェーズを書き換える -->
      <!-- idは後で置き換えたいものに使用する -->
      <div id="game-info">
        連勝数:0
      </div>

      <!-- ステータスを扱うセクション -->
      <section class="status-area">
        <div id="player-status" class="status-card">
          プレイヤーステータス
        </div>

        <div id="enemy-status" class="status-card">
          敵ステータス
        </div>
      </section>

      <!-- バトル画面 -->
      <section class="battle-area">
        <div class="character-area">
          <p>プレイヤー</p>
          <img id="player-image" alt="プレイヤー画像">
        </div>

        <div class="character-area">
          <p>敵</p>
          <img id="enemy-image" alt="敵画像">
        </div>
      </section>

      <!-- 敵が現れた！勇者の通常攻撃！などの文字 -->
      <section id="message-area" class="message-area">
        ここにメッセージを表示
      </section>

      <section id="button-area" class="button-area">
        ボタンがここに表示される
      </section>
    </main>

    <!-- moduleはjsを分けるときに必要。インポートエクスポートが使えて、役割を分けれる -->
     <!-- 通常のJavaScriptではなく、ES Modulesという仕組みを使って読み込む指定 -->
      <!-- 取得に失敗しないためにjsのscriptは最後に -->
       <!-- awaitも使えるようになる -->
        <!-- ★main.jsに移動 -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
